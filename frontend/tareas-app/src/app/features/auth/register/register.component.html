<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white text-center">
          <!-- Logo y nombre de la aplicación -->
          <i class="bi bi-mortarboard fs-1"></i>
          <h2 class="mb-0">EduTech</h2>
          <p class="mb-0 small">Crear una cuenta</p>
        </div>
        <div class="card-body">
          <div *ngIf="errorMessage" class="alert alert-danger">
            {{ errorMessage }}
          </div>
          <div *ngIf="successMessage" class="alert alert-success">
            {{ successMessage }}
          </div>
          
          <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label">Email *</label>
              <input type="email" class="form-control" [(ngModel)]="email" name="email" required>
            </div>
            
            <div class="mb-3">
              <label class="form-label">Teléfono</label>
              <input type="tel" class="form-control" [(ngModel)]="telefono" name="telefono">
            </div>
            
            <div class="mb-3">
              <label class="form-label">Contraseña *</label>
              <div class="input-group mb-2">
                <input 
                  [type]="showPassword ? 'text' : 'password'"
                  class="form-control"
                  [(ngModel)]="password"
                  (input)="validarPassword()"
                  name="password"
                  required>
                <span 
                  class="password-toggle"
                  (click)="togglePassword()">
                  <i 
                    class="bi"
                    [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'">
                  </i>
                </span>
              </div>
              <!-- Requisitos de contraseña -->
              <small class="d-block mb-2" style="color: #666;">Requisitos:</small>
              <ul class="list-unstyled small" style="font-size: 12px;">
                <li [style.color]="hasMinLength ? '#28a745' : '#dc3545'">
                  <i [class]="hasMinLength ? 'bi bi-check-circle-fill' : 'bi bi-x-circle-fill'"></i>
                  Mínimo 6 caracteres
                </li>
                <li [style.color]="hasLowercase ? '#28a745' : '#dc3545'">
                  <i [class]="hasLowercase ? 'bi bi-check-circle-fill' : 'bi bi-x-circle-fill'"></i>
                  Una letra minúscula (a-z)
                </li>
                <li [style.color]="hasDigit ? '#28a745' : '#dc3545'">
                  <i [class]="hasDigit ? 'bi bi-check-circle-fill' : 'bi bi-x-circle-fill'"></i>
                  Un número (0-9)
                </li>
              </ul>
            </div>

            <div class="mb-3">
              <label class="form-label">Confirmar Contraseña *</label>
              <div class="input-group">
                <input 
                  [type]="showConfirmPassword ? 'text' : 'password'"
                  class="form-control"
                  [(ngModel)]="confirmPassword"
                  name="confirmPassword"
                  required>
                <span 
                  class="password-toggle"
                  (click)="toggleConfirmPassword()">
                  <i 
                    class="bi"
                    [ngClass]="showConfirmPassword ? 'bi-eye-slash' : 'bi-eye'">
                  </i>
                </span>
              </div>
            </div>
            
            <div class="mb-3">
              <label class="form-label">Rol</label>
              <select class="form-control" [(ngModel)]="rol" name="rol">
                <option value="Estudiante">Estudiante</option>
                <option value="Docente">Docente</option>
              </select>
            </div>
            
            <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
              {{ loading ? 'Registrando...' : 'Registrarse' }}
            </button>
          </form>
          
          <div class="text-center mt-3">
            <a routerLink="/login">¿Ya tienes cuenta? Inicia sesión</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
